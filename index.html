<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="One ledger for every business you run. Log income and expenses in seconds, then pull a Profit & Loss for all of them combined or any one alone."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;600;700;800&family=Big+Shoulders+Text:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>Business Ledger</title>
    <script>
      // Applied before React mounts to avoid a flash of the wrong theme.
      (function () {
        var stored = localStorage.getItem('theme');
        if (stored ? stored === 'dark' : true) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <!--
      THESIS: One panel where "every business" and "just this business" are the
      same trunk line -- patch in for the combined total, pull cables for one,
      refusing the generic dashboard-mockup SaaS hero.
      OWN-WORLD: Near-black bakelite ground, brass jack rings and screws,
      emerald patch cables for income, rust-red for expense, amber lamp glow
      for active states. Big Shoulders Display for engraved-plate
      labels/headlines (condensed, cast-metal character), Big Shoulders Text
      for running copy, Space Mono tabular figures for every dollar amount
      and ledger number.
      STORY: A visitor running several small businesses sees their own daily
      chaos named and solved: one ledger, one login, and a number that either
      rolls everything up or isolates one instantly -- proven with real
      screenshots of the working app, not mockups.
      FIRST VIEWPORT: The switchboard panel fills the screen at load, dark and
      mostly unlit; as it enters, jacks light and patch cables swing into the
      trunk line one by one while a master total ticks upward like an adding
      machine; headline and Sign In sit inset into the panel like an engraved
      nameplate, lower-left, never floating free of the metal.
      FORM: Switchboard / patch bay, direction 3 of 7 on my own ordered list,
      seed key 8c7fd381.
      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, and DESIGN.md.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
