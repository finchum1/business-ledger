<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="One ledger for every business you run. Log income and expenses in seconds, then pull a Profit & Loss for all of them combined or any one alone."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@500;600;700;800&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Courier+Prime:wght@400;700&family=Work+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Business Ledger</title>
    <script>
      // Applied before React mounts to avoid a flash of the wrong theme.
      (function () {
        var stored = localStorage.getItem('theme');
        if (stored ? stored === 'dark' : true) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <!--
      THESIS: Trust reads like a bound ledger, not a switchboard -- the
      product's own real output (a tabular P&L, a business's running total)
      becomes the entire visual system, refusing both the industrial-panel
      world this page shipped with before and the near-black-neon/cream-
      terracotta AI-fintech default.
      OWN-WORLD: Deep bottle-green leather ground with gold foil tooling,
      cream ledger-paper insets for every card/panel, letterpress-weight
      gold hairline rules, a real photographed ledger book as the hero's
      own image. Bodoni Moda for display (its hairline/thick contrast
      echoes engraved gold tooling and letterpress ledger printing), Spectral
      for body copy (fine-print legibility), Courier Prime for every dollar
      figure (typewritten ledger-entry character, not a "technical" costume),
      Work Sans for small tracked utility labels.
      STORY: A visitor -- running one business or several, single-business
      owners fully served, not an edge case -- sees their own bookkeeping
      taken seriously: a real ledger, not a dashboard mockup, that scales
      the moment a second business shows up, proven with real screenshots
      of the working app.
      FIRST VIEWPORT: The nav bar sits on the same deep-green ground as the
      hero below it. A photographed open ledger book, centered and dominant,
      lies flat facing the viewer, its pages ruled with real business names
      climbing to one bold gold-ruled total; the headline sits above it,
      the single "Get Started" button below.
      FORM: The House Ledger, assigned index 7 of my own 7-candidate list
      (direction concept-seed key dfd5078d), comp A of 3 (symmetric) approved
      by the user over B (asymmetric desk angle) and C (ruled-paper field).
      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, and DESIGN.md.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
