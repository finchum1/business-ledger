<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <title>Sovereign Books</title>
    <script>
      // Applied before React mounts to avoid a flash of the wrong theme.
      (function () {
        var stored = localStorage.getItem('theme');
        if (stored ? stored === 'dark' : true) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <!--
      THESIS: A private fintech, not a metaphor -- Sovereign Books plays the
      category standard straight at full craft, refusing to reach for a
      third governing object/place conceit after two prior worlds (a
      switchboard panel, a bound ledger book) both got retired.
      OWN-WORLD: Near-black graphite ground, one restrained champagne-gold
      accent, real app screenshots mounted in browser-chrome frames --
      Mercury/Ramp/Brex named explicitly as the craft bar. Hanken Grotesk
      (the one typeface throughout, headlines and body and tabular dollar
      figures alike via CSS tabular-nums) in place of the two prior worlds'
      serif/mono splits -- matching how the named references actually set
      type, one confident grotesque voice rather than a display/body
      pairing. (First pick was Geist; swapped after the mechanical detector
      flagged it as one of a handful of faces so common across AI-generated
      UIs it reads as a tell rather than a choice.)
      STORY: A visitor -- running one business or several, single-business
      owners fully served, not an edge case -- sees a serious, well-funded-
      feeling fintech product, proven with the real running app in a real
      browser frame, not a decorative panel or object standing in for it.
      FIRST VIEWPORT: A plain sticky nav (wordmark left, Sign In + Get
      Started right) over a near-black hero: a large confident headline,
      one gold CTA, and a real product screenshot in a BrowserFrame mockup
      directly below -- the defining device of this canon.
      FORM: Canon/standing-exit path, not a rolled direction -- the user
      said "play it straight" after being dealt "Cut to Measure" (bespoke
      tailoring, direction concept-seed key c0259400, index 7 of 7), and
      named the craft bar (Mercury, Ramp, Brex) directly, recorded as a
      standing brand-commitment in PRODUCT.md.
      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, and DESIGN.md.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
