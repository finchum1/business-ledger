<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="One ledger for every business you run. Log income and expenses in seconds, then pull a Profit & Loss for all of them combined or any one alone."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Business Ledger</title>
    <script>
      // Applied before React mounts to avoid a flash of the wrong theme.
      (function () {
        var stored = localStorage.getItem('theme');
        if (stored ? stored === 'dark' : true) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <!--
      THESIS: One panel where "every business" and "just this business" are the
      same trunk line -- patch in for the combined total, pull cables for one,
      refusing the generic dashboard-mockup SaaS hero.
      OWN-WORLD (revised): Warm ivory enamel control-panel ground, brass jack
      rings and screws, deep emerald patch cables for income, rust-red for
      expense, amber lamp glow for active states -- the same physical jack/
      cable/hardware grammar as the original build, lightened from near-black
      bakelite to a lighter enamel at the user's explicit request ("lightened
      up... a little too dark"). IBM Plex Serif for headlines/titles (a
      corporate, ledger-report character in place of the original condensed
      cast-metal display face), IBM Plex Sans for running copy and labels, IBM
      Plex Mono tabular figures for every dollar amount and ledger number --
      swapped in for a more business-like typeset per the same request.
      STORY: A visitor running several small businesses sees their own daily
      chaos named and solved: one ledger, one login, and a number that either
      rolls everything up or isolates one instantly -- proven with real
      screenshots of the working app, not mockups.
      FIRST VIEWPORT: The switchboard panel fills the screen at load; the
      nameplate card sits centered, large, as the first and only thing in
      view, with Sign In inset into it like an engraved nameplate, never
      floating free of the panel.
      FORM: Switchboard / patch bay, direction 3 of 7 on my own ordered list,
      seed key 8c7fd381. Palette and typography revised post-ship; material
      and interaction grammar (jacks/cables/lamps) unchanged.
      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, and DESIGN.md.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
